name: SpeedIsland
options:
  bundleIdPrefix: io.github.kucgiez
  createIntermediateGroups: true
  developmentLanguage: pl
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  SpeedIsland:
    type: application
    platform: iOS
    sources:
      - SpeedIsland
      - Shared
    info:
      path: SpeedIsland/Info.plist
      properties:
        CFBundleDisplayName: SpeedIsland
        UIRequiresFullScreen: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: >-
          Lokalizacja utrzymuje licznik na Dynamicznej Wyspie przy życiu w tle.
          Współrzędne są ignorowane: nie są zapisywane ani nigdzie wysyłane.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kucgiez.speedisland
        # Logika intencji (Shared/Intents.swift) kompiluje się tylko w aplikacji, nie w widgecie.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SPEEDISLAND_APP
    dependencies:
      - target: SpeedIslandWidget
  SpeedIslandWidget:
    type: app-extension
    platform: iOS
    sources:
      - SpeedIslandWidget
      - Shared
    info:
      path: SpeedIslandWidget/Info.plist
      properties:
        CFBundleDisplayName: SpeedIsland
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kucgiez.speedisland.widget
schemes:
  SpeedIsland:
    build:
      targets:
        SpeedIsland: all
    run:
      config: Debug
    archive:
      config: Release
